<style>
:root{--max:100vw;--pad:clamp(20px,5.7vw,82px);--g:#064B3B;--g2:#0a6a54;--cream:#F7F3E8;--gold:#C58A2B;--ink:#1d2a26;--card:#fffdf6;--line:#e3dcc7;--hh:78px;--ease:cubic-bezier(.77,0,.18,1)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 14px)}
body{font:16px/1.7 Manrope,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden}
img{max-width:100%}a,button{-webkit-tap-highlight-color:transparent}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
h1,h2,h3{font-family:'Cormorant Garamond',serif;line-height:1.1;color:var(--g);font-weight:600}
h2{font-size:clamp(2rem,4.5vw,3.3rem)}h3{font-size:1.5rem}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.wrap{max-width:var(--max);margin:auto;padding:0 var(--pad);width:100%}section.s{padding:92px 0;position:relative}
.btn{display:inline-block;padding:13px 26px;border-radius:40px;border:1.5px solid var(--gold);background:var(--gold);color:#fff;cursor:pointer;font:600 15px Manrope;transition:.3s;text-align:center;position:relative;overflow:hidden}
.btn:hover{background:#a97214;border-color:#a97214;transform:translateY(-2px);box-shadow:0 10px 24px rgba(197,138,43,.35)}.btn.o{background:transparent;color:var(--g);border-color:var(--g)}.btn.o:hover{background:var(--g);color:#fff;box-shadow:0 10px 24px rgba(6,75,59,.25)}
.btn.w{background:transparent;color:#fff;border-color:#fff}.btn.w:hover{background:#fff;color:var(--g)}
header{position:sticky;top:0;z-index:60;background:#fff;height:var(--hh);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:100%}
.logo img{height:56px;width:auto}
nav{display:flex;gap:28px;align-items:center;font-weight:500;font-size:15px}
nav>a,.dd>a{padding:8px 0;position:relative}nav>a:not(.btn):after,.dd>a:after{content:"";position:absolute;left:0;bottom:2px;height:2px;width:0;background:var(--gold);transition:.3s}
nav>a:hover:after,nav>a.act:after,.dd:hover>a:after,.dd>a.act:after{width:100%}
.dd{position:relative}.dd>a{display:inline-flex}.dd>a:before{content:"▾";font-size:11px;margin-left:5px;order:2}
.dm{position:absolute;top:100%;left:-18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:230px;box-shadow:0 20px 40px rgba(6,75,59,.15);opacity:0;visibility:hidden;transform:translateY(8px);transition:.25s}
.dd:hover .dm,.dd:focus-within .dm{opacity:1;visibility:visible;transform:none}
.dm a{display:block;padding:10px 14px;border-radius:8px;font-size:14.5px}.dm a:hover,.dm a.act{background:var(--cream);color:var(--g)}
#burger{display:none;background:none;border:0;font-size:28px;color:var(--g);cursor:pointer}
#cur{position:fixed;inset:0;z-index:300;background:var(--g);transform:translateY(100%);pointer-events:none;display:grid;place-items:center}

 about:['About Chikkaballapura','Chikkaballapura is a newly carved district out of Kolar in the southern part of the state, which has the potential to be a Greater Bengaluru. Chikkaballapur is the commercial hub for the silk industry. It’s the second largest district practicing sericulture with the average cocoon production higher than the state average. The region is also known for the variety of fruits and vegetables that it produces, including grapes, mango, pomegranate, tomato, potato, carrot and brinjal. As per a study, 40% of Bangalore’s required fruits, vegetables and flowers are supplied by Chikkaballapura.','Water sources: the rivers Papagni, Chitravathi and Pinakini.']},

P.forEach((p,i)=>R[p.id]=()=>proj(p,i).replace('<div class="wrap">','<a class="back" href="#projects" data-back><span>←</span> All Projects</a><div class="wrap">'));
const NAV=()=>`<a href="#home" data-r="home">Home</a><a href="#about" data-r="about">About Us</a><div class="dd"><a href="#projects" data-r="proj">Projects</a><div class="dm">${P.map(p=>`<a href="#${p.id}" data-r="${p.id}">${p.n}</a>`).join('')}</div></div><a href="#gallery" data-r="gallery">Gallery</a><a href="#contact" data-r="contact">Contact</a><a class="btn" href="#contact">Enquire Now</a>`;
$('#nv').innerHTML=NAV();$('#yr').textContent=new Date().getFullYear();

/* router — behaves like a multi-page site: one page in the DOM at a time, hash kept in sync,
   back/forward restore scroll position, page swaps happen behind the curtain with an instant
   (not animated) jump to the top so nothing slides or stutters. */
const cur=$('#cur'),app=$('#app'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let first=true,raf,current=null,byClick=false,busy=false,again=false,lastKey='home';
const POS={};if('scrollRestoration' in history)history.scrollRestoration='manual';
const hh=()=>$('header').offsetHeight;
const parse=()=>{const h=decodeURIComponent((location.hash||'#home').slice(1))||'home',[r,sec]=h.split('/');return{r:R[r]?r:'home',sec:R[r]?(sec||null):null,key:h}};
const jump=y=>{const d=document.documentElement,o=d.style.scrollBehavior;d.style.scrollBehavior='auto';window.scrollTo(0,y);d.style.scrollBehavior=o};
const yOf=el=>el.getBoundingClientRect().top+scrollY-hh()-12;
const glide=y=>window.scrollTo({top:Math.max(0,y),behavior:RM?'auto':'smooth'});
function draw(r){app.innerHTML=R[r]();bgFallback(app);
 document.title=(r==='home'?'':(P.find(p=>p.id===r)?.n||(r==='projects'?'Our Projects':r[0].toUpperCase()+r.slice(1)))+' | ')+'Charigan Group';
 const isP=r==='projects'||P.some(p=>p.id===r);
 document.querySelectorAll('#nv a[data-r]').forEach(a=>{const d=a.dataset.r,on=d===r||(d==='proj'&&isP);a.classList.toggle('act',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
 $('#nv').classList.remove('on');current=r;setup(r)}
function place(t,y){if(y!=null)jump(y);else if(t.sec&&document.getElementById(t.sec))jump(yOf(document.getElementById(t.sec)));else jump(0)}
const reveal=()=>{document.querySelectorAll('.ban,#stage').forEach(e=>e.classList.add('go'))};
function go(){
 const t=parse(),click=byClick;byClick=false;
 const back=!click&&!first&&POS[t.key]!=null?POS[t.key]:null;   // browser back/forward → restore position
 lastKey=t.key;
 if(!first&&current===t.r){                                          // same page → smooth in-page scroll
  if(back!=null)glide(back);else if(t.sec&&document.getElementById(t.sec))glide(yOf(document.getElementById(t.sec)));else glide(0);
  return}
 if(first||RM){first=false;draw(t.r);place(t,back);requestAnimationFrame(()=>setTimeout(reveal,60));return}
 if(busy){again=true;return}busy=true;
 cur.style.transition='none';cur.style.transform='translateY(100%)';cur.classList.remove('in');void cur.offsetHeight;
 cur.style.transition='transform .5s var(--ease)';cur.style.transform='none';cur.classList.add('in');
 setTimeout(()=>{draw(t.r);place(t,back);
  requestAnimationFrame(()=>{cur.style.transition='transform .6s var(--ease)';cur.style.transform='translateY(-100%)';cur.classList.remove('in');
   setTimeout(reveal,380);setTimeout(()=>{busy=false;if(again){again=false;go()}},620)})},540)}
addEventListener('hashchange',e=>{const o=decodeURIComponent((e.oldURL.split('#')[1]||'home'))||'home';POS[o]=scrollY;go()});
document.addEventListener('click',e=>{
 const a=e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey)return;
 const h=a.getAttribute('href');if(h==='#')return e.preventDefault();
 // "All Projects" right after coming from the list → real browser back, so the list returns where you left it
 if(a.hasAttribute('data-back')&&go._prev==='projects'){e.preventDefault();history.back();return}
 byClick=true;
 if(decodeURIComponent(h.slice(1))===(decodeURIComponent(location.hash.slice(1))||'home')){e.preventDefault();go()} // same hash: no hashchange fires
},true);
addEventListener('hashchange',()=>{go._prev=go._now;go._now=parse().r});go._now=parse().r;
/* effects */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(e.target.classList.contains('cnt'))count(e.target);io.unobserve(e.target)}}),{threshold:.12});
function count(el){const n=+el.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1600),v=Math.round(n*(1-Math.pow(1-k,3)));el.textContent=v.toLocaleString('en-IN')+el.dataset.s;if(k<1)requestAnimationFrame(f)})(t0)}
let fills=[],X={};
function setup(r){document.querySelectorAll('.rv,.head,.cnt').forEach(e=>io.observe(e));
 fills=[...document.querySelectorAll('.fill')];fills.forEach(p=>{p.innerHTML=p.textContent.trim().split(/\s+/).map(w=>`<span class="w">${w}</span>`).join(' ');p._w=[...p.children];p._n=-1});
 const hero=$('#hero');X=hero?{hero,st:$('#stage'),md:$('#sxMedia'),fr:$('#sxFrame'),bg:$('#sxBg'),copy:$('#sxCopy'),ct:$('.sx-ctas'),strip:$('#sxStrip'),sc:$('#sxScroll'),end:$('#sxEnd'),
  lines:[...document.querySelectorAll('.sx-title .ln')],spans:[...document.querySelectorAll('.sx-title .ln>span')],fade:[...document.querySelectorAll('.sx-eye,.sx-sub,.sx-ctas')]}:{};
 X.bi=$('.ban .bi');X.plan=$('#frame');tick._tr=0;tick._p=-1;
 if(r==='home' && $('#videoCarousel')){const vc=$('#videoCarousel');$('#videoPrev').onclick=()=>vc.scrollBy({left:-vc.clientWidth/3-18,behavior:'smooth'});$('#videoNext').onclick=()=>vc.scrollBy({left:vc.clientWidth/3+18,behavior:'smooth'});}
 if(r==='home' && $('#homeScrollGallery')){
  const gallery=$('#homeScrollGallery'),viewport=gallery.querySelector('.home-scroll-viewport'),track=gallery.querySelector('.home-scroll-track');
  const prev=gallery.querySelector('.home-gallery-prev'),next=gallery.querySelector('.home-gallery-next');let offset=0;
  const visibleWidth=()=>viewport.clientWidth-parseFloat(getComputedStyle(viewport).paddingLeft||0)-parseFloat(getComputedStyle(viewport).paddingRight||0);
  const maxOffset=()=>Math.max(0,track.scrollWidth-visibleWidth());
  const stepSize=()=>{const card=track.querySelector('.home-scroll-card');return card?card.getBoundingClientRect().width+parseFloat(getComputedStyle(track).gap||22):320};
  const update=()=>{offset=Math.max(0,Math.min(maxOffset(),offset));track.style.transform=`translate3d(${-offset}px,0,0)`;if(prev)prev.disabled=offset<=1;if(next)next.disabled=offset>=maxOffset()-1;};
  prev?.addEventListener('click',()=>{offset-=stepSize();update()});next?.addEventListener('click',()=>{offset+=stepSize();update()});
  addEventListener('resize',update);requestAnimationFrame(()=>requestAnimationFrame(update));
 }
 if(r==='gallery'){const gal=k=>{$('#gal').innerHTML=_G[k].map(s=>`<img src="${SZ(s,1200)}" alt="${k}" loading="lazy" decoding="async">`).join('')};gal('Office');
  $('#tabs').onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');gal(e.target.textContent)}}
 tick()}
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),mob=()=>innerWidth<768,ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function tick(){const vh=innerHeight,y=scrollY;
 if(X.hero){const {hero,st,md}=X,vw=innerWidth,H=st.offsetHeight,mb=vw<900&&innerHeight>520,total=hero.offsetHeight-H,p=RM?0:cl(y/Math.max(total,1));
  if(p!==tick._p||tick._w!==vw){tick._p=p;
  const e=ease(cl(p/.82)),side=Math.min(82,Math.max(20,vw*.057));
  let b;if(mb){const cb=X.copy.offsetTop+X.ct.offsetTop+X.ct.offsetHeight;b={t:Math.min(Math.max(cb+28,H*.5),H*.78),l:vw*.06,r:vw*.06,b:H*.05}}
  else{if(!tick._tr||tick._w!==vw){tick._w=vw;X.lines.forEach(l=>l.style.transform='');tick._tr=Math.max(...X.spans.map(x=>{const g=document.createRange();g.selectNodeContents(x);return g.getBoundingClientRect().right}),...[...document.querySelectorAll('.sx-ctas .btn')].map(x=>x.getBoundingClientRect().right-24),...[...document.querySelectorAll('.sx-sub')].map(x=>{const g=document.createRange();g.selectNodeContents(x);return g.getBoundingClientRect().right-24}))}b={t:H*.14,l:Math.max(vw*.54,tick._tr+72),r:Math.min(side,vw*.06),b:H*.2}}
  tick._w=vw;
  const L=(a,c,k)=>a+(c-a)*k,inset=`inset(${L(b.t,0,e).toFixed(1)}px ${L(b.r,0,e).toFixed(1)}px ${L(b.b,0,e).toFixed(1)}px ${L(b.l,0,e).toFixed(1)}px)`;
  md.style.clipPath=inset;md.style.webkitClipPath=inset;
  const tf=`perspective(1400px) ${mb?'rotateX':'rotateY'}(${L(mb?14:-16,0,e).toFixed(2)}deg) scale(${L(.96,1,e).toFixed(4)})`;
  md.style.transform=tf;md.firstElementChild.style.transform=`translate3d(0,${mb?(b.t*.8*(1-e)).toFixed(1):0}px,0) scale(${L(1.22,1,e).toFixed(4)})`; /* phones: frame sits low, so lower the photo inside it to show the towers and canopy */md.style.setProperty('--shade',cl((p-.55)/.3).toFixed(3));
  X.fr.style.cssText=`top:${L(b.t,0,e)-14}px;left:${L(b.l,0,e)-14}px;right:${L(b.r,0,e)-14}px;bottom:${L(b.b,0,e)-14}px;opacity:${(1-e*1.6).toFixed(3)};transform:${tf}`;
  X.bg.style.opacity=(1-e).toFixed(3);
  X.lines.forEach((l,i)=>{l.style.transform=p>.001?`translate3d(${((i%2?1:-1)*e*vw*.5).toFixed(1)}px,0,0)`:'';l.style.opacity=p>.001?(1-e*1.3).toFixed(3):''});
  const co=cl(1-p*3.2);X.fade.forEach(x=>{x.style.opacity=p>.001?co:'';x.style.transform=p>.001?`translateY(${(-p*60).toFixed(1)}px)`:''});
  X.copy.style.pointerEvents=co<.2?'none':'';
  X.strip.style.opacity=X.sc.style.opacity=cl(1-p*4);
  const ep=cl((p-.72)/.2);X.end.style.opacity=ep;X.end.style.transform=`translateY(${((1-ep)*30).toFixed(1)}px)`}}
 if(X.bi&&y<vh*1.2)X.bi.style.translate=`0 ${(y*.28).toFixed(1)}px`;
 if(X.plan){const r=X.plan.getBoundingClientRect();if(r.bottom>0&&r.top<vh){const q=cl(1-(r.top+r.height/2-vh*.35)/(vh*.7)),m=mob();X.plan.style.transform=`rotateX(${(20-20*q).toFixed(2)}deg) scale(${(m?.94+.06*q:1.05-.05*q).toFixed(4)})`}}
 for(const p of fills){const r=p.getBoundingClientRect();if(r.bottom<-50||r.top>vh+50)continue;
  const k=cl((vh*.88-r.top)/(r.height+vh*.35)),n=Math.min(p._w.length,Math.ceil(k*p._w.length*1.08));
  if(n!==p._n){const lo=Math.min(n,Math.max(p._n,0)),hi=Math.max(n,Math.max(p._n,0));for(let i=lo;i<hi;i++)p._w[i].classList.toggle('on',i<n);if(p._n<0)p._w.forEach((w,i)=>w.classList.toggle('on',i<n));p._n=n}}}

let ticking=false;addEventListener('scroll',()=>{if(ticking)return;ticking=true;raf=requestAnimationFrame(()=>{ticking=false;tick()})},{passive:true});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{tick._tr=0;tick._p=-1;tick()},100)});
/* interactions */
const lb=$('#lb'),lbi=$('#lbi');let lbImages=[],lbIndex=0;
function showLbImage(i){if(!lbImages.length)return;lbIndex=(i+lbImages.length)%lbImages.length;const im=lbImages[lbIndex];lbi.src=SZ(im.currentSrc||im.src,2000);lbi.alt=im.alt||'Gallery image'}
function closeLb(){lb.classList.remove('on');lbi.removeAttribute('src');lbImages=[]}
$('#lbClose').onclick=closeLb;$('#lbPrev').onclick=e=>{e.stopPropagation();showLbImage(lbIndex-1)};$('#lbNext').onclick=e=>{e.stopPropagation();showLbImage(lbIndex+1)};
document.addEventListener('click',e=>{const t=e.target;
 if(t.tagName==='IMG'&&t.closest('.gal,.frame,.mq')){const scope=t.closest('.gal,.frame,.mq');lbImages=[...scope.querySelectorAll('img')].filter(im=>im.src);lbIndex=lbImages.indexOf(t);showLbImage(lbIndex);lb.classList.add('on');return}
 if(t===lb){closeLb();return}
 const a=t.closest('a[data-pr]');if(a)sessionStorage.setItem('pr',a.dataset.pr);
 const w=t.closest('[data-w]');if(w){document.querySelectorAll('.wt button').forEach(b=>b.classList.remove('on'));w.classList.add('on');const d=WI[+w.dataset.w];$('#wp').innerHTML=`<h3>${d[0]}</h3><p>${d[1]}</p>`}
 const c=t.closest('[data-car]');if(c)document.querySelector('.car').scrollBy({left:+c.dataset.car*300,behavior:'smooth'});
 if(t.classList.contains('rm')){const p=t.previousElementSibling;p.classList.toggle('open');t.textContent=p.classList.contains('open')?'Show less':'Read more'}
 if(t.closest('#burger'))$('#nv').classList.toggle('on');else if(t.closest('#nv a'))$('#nv').classList.remove('on')});
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')closeLb();else if(e.key==='ArrowLeft')showLbImage(lbIndex-1);else if(e.key==='ArrowRight')showLbImage(lbIndex+1)});
let tilt=null,tq=0;document.addEventListener('mousemove',e=>{if(tq)return;tq=requestAnimationFrame(()=>{tq=0;const c=e.target.closest&&e.target.closest('.pc');
 if(tilt&&tilt!==c){tilt.style.transform='';tilt=null}
 if(c&&!RM){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;tilt=c;c.style.transform=`rotateY(${(x*8).toFixed(2)}deg) rotateX(${(-y*8).toFixed(2)}deg) translateY(-6px)`}})},{passive:true});
document.addEventListener('click',e=>{const y=e.target.closest('.yt');if(!y)return;
 const f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+y.dataset.yt+'?autoplay=1&rel=0';f.title='Charigan Group office video';
 f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.style.cssText='display:block;width:100%;max-width:900px;aspect-ratio:16/9;height:auto;border:0;border-radius:18px';y.replaceWith(f)});
document.addEventListener('submit',e=>{if(!e.target.classList.contains('fm'))return;e.preventDefault();const d=new FormData(e.target);
 location.href=`mailto:sales@charigangroup.com?subject=${encodeURIComponent('Site visit enquiry – '+(d.get('pr')||'General'))}&body=${encodeURIComponent(`Name: ${d.get('fn')} ${d.get('ln')}\nPhone: ${d.get('ph')}\nEmail: ${d.get('em')}\nProject: ${d.get('pr')}\n\n${d.get('msg')}`)}`});
new MutationObserver(()=>{const pr=sessionStorage.getItem('pr');if(pr){document.querySelectorAll('select[name=pr]').forEach(s=>s.value=pr);sessionStorage.removeItem('pr')}}).observe(app,{childList:true});
go();
