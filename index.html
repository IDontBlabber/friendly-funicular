<style>
:root{--max:100vw;--pad:clamp(20px,5.7vw,82px);--g:#064B3B;--g2:#0a6a54;--cream:#F7F3E8;--gold:#C58A2B;--ink:#1d2a26;--card:#fffdf6;--line:#e3dcc7;--hh:78px;--ease:cubic-bezier(.77,0,.18,1)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 14px)}
body{font:16px/1.7 Manrope,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden}
img{max-width:100%}a,button{-webkit-tap-highlight-color:transparent}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
h1,h2,h3{font-family:'Cormorant Garamond',serif;line-height:1.1;color:var(--g);font-weight:600}
h2{font-size:clamp(2rem,4.5vw,3.3rem)}h3{font-size:1.5rem}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.wrap{max-width:var(--max);margin:auto;padding:0 var(--pad);width:100%}section.s{padding:92px 0;position:relative}
.btn{display:inline-block;padding:13px 26px;border-radius:40px;border:1.5px solid var(--gold);background:var(--gold);color:#fff;cursor:pointer;font:600 15px Manrope;transition:.3s;text-align:center;position:relative;overflow:hidden}
.btn:hover{background:#a97214;border-color:#a97214;transform:translateY(-2px);box-shadow:0 10px 24px rgba(197,138,43,.35)}.btn.o{background:transparent;color:var(--g);border-color:var(--g)}.btn.o:hover{background:var(--g);color:#fff;box-shadow:0 10px 24px rgba(6,75,59,.25)}
.btn.w{background:transparent;color:#fff;border-color:#fff}.btn.w:hover{background:#fff;color:var(--g)}
header{position:sticky;top:0;z-index:60;background:#fff;height:var(--hh);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:100%}
.logo img{height:56px;width:auto}
nav{display:flex;gap:28px;align-items:center;font-weight:500;font-size:15px}
nav>a,.dd>a{padding:8px 0;position:relative}nav>a:not(.btn):after,.dd>a:after{content:"";position:absolute;left:0;bottom:2px;height:2px;width:0;background:var(--gold);transition:.3s}
nav>a:hover:after,nav>a.act:after,.dd:hover>a:after,.dd>a.act:after{width:100%}
.dd{position:relative}.dd>a{display:inline-flex}.dd>a:before{content:"▾";font-size:11px;margin-left:5px;order:2}
.dm{position:absolute;top:100%;left:-18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:230px;box-shadow:0 20px 40px rgba(6,75,59,.15);opacity:0;visibility:hidden;transform:translateY(8px);transition:.25s}
.dd:hover .dm,.dd:focus-within .dm{opacity:1;visibility:visible;transform:none}
.dm a{display:block;padding:10px 14px;border-radius:8px;font-size:14.5px}.dm a:hover,.dm a.act{background:var(--cream);color:var(--g)}
#burger{display:none;background:none;border:0;font-size:28px;color:var(--g);cursor:pointer}
#cur{position:fixed;inset:0;z-index:300;background:var(--g);transform:translateY(100%);pointer-events:none;display:grid;place-items:center}

   master-plan overflow guard, which only removes a sideways scroll.
   ===================================================================== */
/* 1. Project cards: never wider than the screen (were min 330px → overflowed ≤360px phones) */
.grid{grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
/* 2. Master plan 3D frame: no sideways page scroll from its scale effect */
.pw{overflow-x:clip}

/* 3. Comfortable tap targets on touch screens */
@media (hover:none),(max-width:1180px){
  .rm{display:inline-flex;align-items:center;min-height:44px;padding:0 2px}

}

}

@media (max-width:640px){

  .stats b{font-size:clamp(1.55rem,7.2vw,2.2rem);overflow-wrap:anywhere}
  .stats span{font-size:12.5px;line-height:1.35;display:block;margin-top:4px}

  .lc{flex-basis:72vw}
  .am{grid-template-columns:1fr}

 about:['About Chikkaballapura','Chikkaballapura is a newly carved district out of Kolar in the southern part of the state, which has the potential to be a Greater Bengaluru. Chikkaballapur is the commercial hub for the silk industry. It’s the second largest district practicing sericulture with the average cocoon production higher than the state average. The region is also known for the variety of fruits and vegetables that it produces, including grapes, mango, pomegranate, tomato, potato, carrot and brinjal. As per a study, 40% of Bangalore’s required fruits, vegetables and flowers are supplied by Chikkaballapura.','Water sources: the rivers Papagni, Chitravathi and Pinakini.']},

 }

const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),mob=()=>innerWidth<768,ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function tick(){const vh=innerHeight,y=scrollY;
 if(X.hero){const {hero,st,md}=X,vw=innerWidth,H=st.offsetHeight,mb=vw<900&&innerHeight>520,total=hero.offsetHeight-H,p=RM?0:cl(y/Math.max(total,1));

  let b;if(mb){const cb=X.copy.offsetTop+X.ct.offsetTop+X.ct.offsetHeight;b={t:Math.min(Math.max(cb+28,H*.5),H*.78),l:vw*.06,r:vw*.06,b:H*.05}}
  else{if(!tick._tr||tick._w!==vw){tick._w=vw;X.lines.forEach(l=>l.style.transform='');tick._tr=Math.max(...X.spans.map(x=>{const g=document.createRange();g.selectNodeContents(x);return g.getBoundingClientRect().right}),...[...document.querySelectorAll('.sx-ctas .btn')].map(x=>x.getBoundingClientRect().right-24),...[...document.querySelectorAll('.sx-sub')].map(x=>{const g=document.createRange();g.selectNodeContents(x);return g.getBoundingClientRect().right-24}))}b={t:H*.14,l:Math.max(vw*.54,tick._tr+72),r:Math.min(side,vw*.06),b:H*.2}}
  tick._w=vw;
  const L=(a,c,k)=>a+(c-a)*k,inset=`inset(${L(b.t,0,e).toFixed(1)}px ${L(b.r,0,e).toFixed(1)}px ${L(b.b,0,e).toFixed(1)}px ${L(b.l,0,e).toFixed(1)}px)`;
  md.style.clipPath=inset;md.style.webkitClipPath=inset;

  md.style.transform=tf;md.firstElementChild.style.transform=`translate3d(0,${mb?(b.t*.8*(1-e)).toFixed(1):0}px,0) scale(${L(1.22,1,e).toFixed(4)})`; /* phones: frame sits low, so lower the photo inside it to show the towers and canopy */md.style.setProperty('--shade',cl((p-.55)/.3).toFixed(3));
  X.fr.style.cssText=`top:${L(b.t,0,e)-14}px;left:${L(b.l,0,e)-14}px;right:${L(b.r,0,e)-14}px;bottom:${L(b.b,0,e)-14}px;opacity:${(1-e*1.6).toFixed(3)};transform:${tf}`;
  X.bg.style.opacity=(1-e).toFixed(3);
  X.lines.forEach((l,i)=>{l.style.transform=p>.001?`translate3d(${((i%2?1:-1)*e*vw*.5).toFixed(1)}px,0,0)`:'';l.style.opacity=p>.001?(1-e*1.3).toFixed(3):''});
  const co=cl(1-p*3.2);X.fade.forEach(x=>{x.style.opacity=p>.001?co:'';x.style.transform=p>.001?`translateY(${(-p*60).toFixed(1)}px)`:''});
  X.copy.style.pointerEvents=co<.2?'none':'';
  X.strip.style.opacity=X.sc.style.opacity=cl(1-p*4);
  const ep=cl((p-.72)/.2);X.end.style.opacity=ep;X.end.style.transform=`translateY(${((1-ep)*30).toFixed(1)}px)`}}

 for(const p of fills){const r=p.getBoundingClientRect();if(r.bottom<-50||r.top>vh+50)continue;
